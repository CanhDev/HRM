<h2 mat-dialog-title>{{ isEdit ? 'Sửa chức vụ' : 'Thêm chức vụ' }}</h2>

<mat-dialog-content class="no-top-padding">

  <div class="form-wrapper" [formGroup]="positionForm">
    <mat-form-field class="w-120" appearance="outline">
      <mat-label>Mã chức vụ</mat-label>
      <input matInput formControlName="positionCode" />
      <mat-error *ngIf="positionForm.get('positionCode')?.hasError('required')">
        Mã chức vụ là bắt buộc
      </mat-error>
    </mat-form-field>

    <mat-form-field class="w-120" appearance="outline">
      <mat-label>Tên chức vụ</mat-label>
      <input matInput formControlName="positionName" />
      <mat-error *ngIf="positionForm.get('positionName')?.hasError('required')">
        Tên chức vụ là bắt buộc
      </mat-error>
    </mat-form-field>
      <div class="form-group">
        <label for="status">Mô tả</label>
        <textarea formControlName="description" rows="3" class="form-control"></textarea>
    </div>
    <div class="form-group">
    <label for="status">Trạng thái</label>
    <select class="form-select" id="status" formControlName="status">
      <option *ngFor="let status of statusList" [value]="status.form_value">
        {{ status.form_name }}
      </option>
    </select>
  </div>
    
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Hủy</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="positionForm.invalid">
    Lưu
  </button>
</mat-dialog-actions>
